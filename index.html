<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>うんちハンター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- タイトル画面 -->
    <section id="screen-title" class="screen active">
      <h1 class="game-title">💩 うんちハンター 💩</h1>
      <p class="subtitle">本物の「うんち」を誰よりも早く見抜け！</p>
      
      <div class="menu-buttons">
        <button id="btn-mode-single" class="btn btn-primary">ひとりであそぶ</button>
        <button id="btn-mode-multi" class="btn btn-secondary">ふたりであそぶ</button>
        <button id="btn-highscore" class="btn btn-info">じぶんのベスト</button>
      </div>
    </section>

    <!-- ひとりであそぶ ゲーム画面 -->
    <section id="screen-single-game" class="screen">
      <div class="game-header">
        <div class="round-indicator">ラウンド: <span id="single-round-num">1</span> / 5</div>
        <div class="level-indicator">難易度: <span id="single-level-name">EASY</span></div>
      </div>
      <div class="timer-display">タイム: <span id="single-timer">0.000</span> 秒</div>

      <div class="word-card-container">
        <div id="single-word-card" class="word-card">???</div>
      </div>

      <div class="game-footer">
        <p id="single-message" class="game-message">画面をよく見てね！</p>
      </div>
    </section>

    <!-- ひとりであそぶ リザルト画面 -->
    <section id="screen-single-result" class="screen">
      <h2>🎉 クリア！ 🎉</h2>
      <div class="result-box">
        <p class="result-label">ごうけいタイム</p>
        <p id="single-total-time" class="result-score">0.000 秒</p>
        <div id="single-title-display" class="title-badge"></div>
      </div>
      
      <div class="result-buttons">
        <button id="btn-single-retry" class="btn btn-primary">もう一度あそぶ</button>
        <button id="btn-single-to-title" class="btn btn-secondary">タイトルへ</button>
      </div>
    </section>

    <!-- ふたりであそぶ 設定画面 -->
    <section id="screen-multi-setup" class="screen">
      <h2>ふたりであそぶ (対戦)</h2>
      <div class="setup-form">
        <div class="form-group">
          <label for="multi-target-score">勝利条件 (さきに取ったほうが勝ち):</label>
          <select id="multi-target-score">
            <option value="3">3ポイント先取</option>
            <option value="5" selected>5ポイント先取</option>
            <option value="10">10ポイント先取</option>
          </select>
        </div>
        <div class="form-group">
          <label for="multi-difficulty">難易度:</label>
          <select id="multi-difficulty">
            <option value="1">レベル 1 (EASY)</option>
            <option value="2" selected>レベル 2 (NORMAL)</option>
            <option value="3">レベル 3 (HARD)</option>
            <option value="4">レベル 4 (CHAOS)</option>
          </select>
        </div>
      </div>
      <div class="menu-buttons">
        <button id="btn-multi-start" class="btn btn-primary">対戦スタート！</button>
        <button id="btn-multi-to-title" class="btn btn-secondary">タイトルへ</button>
      </div>
    </section>

    <!-- ふたりであそぶ ゲーム画面 -->
    <section id="screen-multi-game" class="screen">
      <!-- プレイヤー2 (上側・上下反転) -->
      <div id="p2-area" class="player-area p2-area">
        <div class="p2-info">
          <span>P2 得点: <span id="p2-score">0</span></span>
        </div>
        <button id="p2-btn" class="btn btn-tap p2-btn">GET!</button>
      </div>

      <!-- 中央表示エリア -->
      <div class="center-area">
        <div id="multi-word-card" class="word-card">???</div>
      </div>

      <!-- プレイヤー1 (下側) -->
      <div id="p1-area" class="player-area p1-area">
        <button id="p1-btn" class="btn btn-tap p1-btn">GET!</button>
        <div class="p1-info">
          <span>P1 得点: <span id="p1-score">0</span></span>
        </div>
      </div>
    </section>

    <!-- ふたりであそぶ リザルト画面 -->
    <section id="screen-multi-result" class="screen">
      <h2 id="multi-winner-text">P1 のかち！</h2>
      <div class="result-box">
        <p id="multi-final-score">5 - 3</p>
      </div>
      <div class="result-buttons">
        <button id="btn-multi-retry" class="btn btn-primary">もう一度対戦</button>
        <button id="btn-multi-to-title" class="btn btn-secondary">タイトルへ</button>
      </div>
    </section>

    <!-- ハイスコア画面 -->
    <section id="screen-highscore" class="screen">
      <h2>🏆 じぶんのベスト 5 🏆</h2>
      <ol id="highscore-list" class="highscore-list">
        <!-- JSで動的生成 -->
      </ol>
      <div class="menu-buttons">
        <button id="btn-highscore-to-title" class="btn btn-secondary">タイトルへ</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
